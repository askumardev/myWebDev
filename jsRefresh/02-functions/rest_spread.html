<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rest and Spread</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem auto;
        max-width: 900px;
        line-height: 1.7;
        padding: 0 1rem;
      }

      h1 { color: #2c3e50; }

      .note {
        background: #eef6ff;
        border-left: 5px solid #3498db;
        padding: 1rem 1.2rem;
        margin-bottom: 1rem;
        border-radius: 6px;
      }

      .note-title {
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 0.3rem;
      }

      pre {
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Rest and Spread</h1>
    <p>Open this file in a browser to explore the example.</p>

    <div class="note">
      <div class="note-title">Note</div>
      <div>Rest and spread syntax help you work with variable numbers of arguments or copy arrays and objects with less boilerplate.</div>
    </div>

    <pre id="output"></pre>
    <script src="rest_spread.js"></script>
  </body>
</html>
